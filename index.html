<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BRACU Iron Dome: Defend BRAC University</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --ink: #fff3e0;
            --dome: #4fd1c5;
            --warn: #ffb347;
            --panel: rgba(20, 12, 40, .92)
        }

        html {
            height: 100%;
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            height: 100%;
            margin: 0;
            background: #140f2b;
            color: var(--ink);
            font-family: "Trebuchet MS", Verdana, sans-serif;
            overflow: hidden
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: none
        }

        #ov {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px
        }

        #ov.hide {
            display: none
        }

        .card {
            background: var(--panel);
            border: 2px solid var(--dome);
            border-radius: 14px;
            padding: 22px 24px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 40px rgba(79, 209, 197, .35)
        }

        .card h1 {
            margin: 0 0 6px;
            font-size: 28px;
            letter-spacing: .5px
        }

        .card p {
            margin: 8px 0;
            line-height: 1.45;
            font-size: 15px
        }

        .btn {
            display: block;
            width: 100%;
            margin: 8px 0 0;
            padding: 12px;
            border: 0;
            border-radius: 10px;
            background: var(--dome);
            color: #0d1a2b;
            font: 700 16px "Trebuchet MS", Verdana, sans-serif;
            cursor: pointer
        }

        .btn:hover,
        .btn:focus-visible {
            background: #fff3e0;
            outline: 3px solid var(--warn)
        }

        .btn small {
            display: block;
            font-weight: 400;
            font-size: 13px
        }

        h2 {
            margin: 14px 0 4px;
            font-size: 16px;
            color: var(--dome)
        }

        .lb {
            list-style: none;
            margin: 6px 0;
            padding: 0;
            text-align: left;
            counter-reset: n
        }

        .lb li {
            counter-increment: n;
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 15px
        }

        .lb li::before {
            content: counter(n)'.';
            width: 26px;
            color: var(--warn)
        }

        .lb li span {
            flex: 1
        }

        .lb li:nth-child(odd) {
            background: rgba(255, 255, 255, .06)
        }

        .lb li.me {
            background: var(--dome);
            color: #0d1a2b
        }

        .lb li.me::before {
            color: #0d1a2b
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 11px;
            border-radius: 10px;
            border: 2px solid var(--dome);
            background: #0d1a2b;
            color: var(--ink);
            font: 16px "Trebuchet MS", Verdana, sans-serif;
            text-align: center
        }

        .clr {
            margin-top: 10px;
            background: none;
            border: 0;
            color: rgba(255, 243, 224, .5);
            font-size: 12px;
            cursor: pointer
        }

        #mute {
            position: fixed;
            right: 10px;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            background: rgba(20, 12, 40, .7);
            color: var(--ink);
            border: 1px solid var(--dome);
            border-radius: 8px;
            padding: 6px 10px;
            font: 14px "Trebuchet MS", Verdana, sans-serif;
            cursor: pointer
        }
        #ctl {
            position: fixed;
            left: 12px;
            top: calc(8px + env(safe-area-inset-top, 0px));
            display: none;
            gap: 8px;
            z-index: 5
        }

        #ctl button {
            width: 34px;
            height: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 20, 40, .6);
            color: var(--ink);
            border: 1.5px solid rgba(79, 209, 197, .75);
            border-radius: 9px;
            cursor: pointer;
            opacity: .75;
            transition: opacity .15s
        }

        #ctl button:hover,
        #ctl button:focus-visible {
            opacity: 1;
            outline: 2px solid var(--warn)
        }

        #ctl svg {
            width: 16px;
            height: 16px;
            fill: currentColor
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="ov"></div>
    <button id="mute" aria-label="Toggle sound">Sound on</button>
    <div id="ctl">
        <button id="pbtn" aria-label="Pause"></button>
        <button id="rbtn" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg></button>
    </div>

        ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.strokeRect(x0 + .5, 14.5, bw2, 16); ctx.strokeRect(x0 + .5, 36.5, bw2, 16); ctx.fillStyle = 'rgba(0,10,30,.35)'; ctx.fillRect(0, 108, W, 6); ctx.fillStyle = '#ffd23f'; ctx.fillRect(0, 108, W * Math.min(1, S.T / TOT), 6); ctx.fillStyle = '#0d1a2b';[22, 47].forEach(t => ctx.fillRect(W * t / TOT - 1, 108, 3, 6));
        for (let i = 0; i < S.up.max; i++) {
            const f = Math.max(0, Math.min(1, S.ammo - i)), px = cx - S.up.max * 11 + i * 22 + 11, py = H - 10;
            ctx.save(); ctx.translate(px, py); ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(4, -17); ctx.lineTo(4, -2); ctx.lineTo(8, 3); ctx.lineTo(8, 6); ctx.lineTo(4, 3); ctx.lineTo(-4, 3); ctx.lineTo(-8, 6); ctx.lineTo(-8, 3); ctx.lineTo(-4, -2); ctx.lineTo(-4, -17); ctx.closePath();
            ctx.fillStyle = 'rgba(10,20,40,.55)'; ctx.fill(); ctx.save(); ctx.clip(); ctx.fillStyle = f >= 1 ? '#7fe8ff' : '#ffb347'; ctx.fillRect(-10, 6 - 32 * f, 20, 32 * f); ctx.restore();
            ctx.strokeStyle = f >= 1 ? 'rgba(255,255,255,.85)' : 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore()
        }
    }
    if (S.toast > 0 && S.phase == 'play') {
        const e = Math.min(1, (3.2 - S.toast) / .35, S.toast / .35), tw = Math.min(W - 20, 380), ty = 124 - (1 - e) * 80, L = LV[S.lv - 1]; ctx.globalAlpha = e;
        ctx.fillStyle = 'rgba(12,22,40,.88)'; ctx.strokeStyle = 'rgb(' + DC[S.lv - 1] + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, ty, tw, 58, 12); ctx.fill(); ctx.stroke();
        ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 20px "Trebuchet MS",sans-serif'; ctx.fillText((S.lv > 1 ? 'LEVEL UP! ' : '') + 'LEVEL ' + S.lv + ': ' + L.n, W / 2, ty + 25); ctx.fillStyle = '#fff3e0'; ctx.font = '13px "Trebuchet MS",sans-serif'; ctx.fillText(L.sub, W / 2, ty + 46); ctx.globalAlpha = 1
    }
    if (S.warn > 0 && S.phase == 'play' && Math.sin(Date.now() / 140) > -.3) { ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 10; ctx.fillStyle = '#ff2b2b'; ctx.font = 'bold ' + Math.min(44, W / 10) + 'px "Trebuchet MS",sans-serif'; ctx.fillText('WARNING: MEGA MISSILE', W / 2, H * .38); ctx.shadowBlur = 0 }
    if (S.phase == 'play') {
        const rdy = S.ammo >= 1, tk = Date.now() / 900; ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 4; ctx.strokeStyle = rdy ? '#fff' : '#ff8a5e'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 10, 0, 6.28); ctx.moveTo(mouse.x - 17, mouse.y); ctx.lineTo(mouse.x - 6, mouse.y); ctx.moveTo(mouse.x + 6, mouse.y); ctx.lineTo(mouse.x + 17, mouse.y); ctx.moveTo(mouse.x, mouse.y - 17); ctx.lineTo(mouse.x, mouse.y - 6); ctx.moveTo(mouse.x, mouse.y + 6); ctx.lineTo(mouse.x, mouse.y + 17); ctx.stroke();
        ctx.lineWidth = 2; ctx.strokeStyle = rdy ? 'rgba(79,209,197,.95)' : 'rgba(255,179,71,.95)';
        if (rdy) { for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 24, tk + k * 1.5708, tk + k * 1.5708 + .7); ctx.stroke() } } else { ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 24, -Math.PI / 2, -Math.PI / 2 + 6.283 * S.ammo); ctx.stroke() }
        ctx.restore()
    }
}
// ---- pause / restart controls ----
let paused = false;
const pb = document.getElementById('pbtn'), rb = document.getElementById('rbtn'), ctl = document.getElementById('ctl');
const IC_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const IC_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
pb.innerHTML = IC_PAUSE;
function audioOn(on) { try { if (AC) on ? AC.resume() : AC.suspend() } catch (e) { } }
function setPause(on, mode) {
    if (on && S.phase != 'play') return;
    paused = on; pb.innerHTML = on ? IC_PLAY : IC_PAUSE; pb.setAttribute('aria-label', on ? 'Resume' : 'Pause'); audioOn(!on);
    if (on) {
        ov.className = '';
        ov.innerHTML = mode == 'restart'
            ? '<div class="card"><h1>Restart?</h1><p>Your current score will be lost.</p><button class="btn" onclick="restartGame()">Yes, restart</button><button class="clr" onclick="setPause(false)" style="font-size:14px">Keep playing</button></div>'
            : '<div class="card"><h1>Paused</h1><p>Score <b>' + S.score + '</b> &middot; Level ' + S.lv + '/3</p><button class="btn" onclick="setPause(false)">Resume</button><button class="btn" style="background:none;color:var(--ink);border:2px solid var(--dome)" onclick="restartGame()">Restart</button><button class="clr" onclick="toMenu()">Back to menu</button></div>';
    } else ov.className = 'hide'
}
function restartGame() { paused = false; pb.innerHTML = IC_PAUSE; audioOn(true); startGame() }
function toMenu() { paused = false; pb.innerHTML = IC_PAUSE; audioOn(true); menu() }
pb.onclick = () => setPause(!paused);
rb.onclick = () => setPause(true, 'restart');
addEventListener('keydown', e => { if ((e.key == 'p' || e.key == 'P' || e.key == 'Escape') && S.phase == 'play') setPause(!paused) });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.phase == 'play' && !paused) setPause(true) });

let last = performance.now();
function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (!paused) update(dt); ctl.style.display = S.phase == 'play' ? 'flex' : 'none'; draw(); requestAnimationFrame(loop) }
requestAnimationFrame(loop);

</script>
